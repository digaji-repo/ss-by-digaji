services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-droproom}
      MYSQL_USER: ${MYSQL_USER:-droproom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamavdb:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      APP_ENV: production
      SERVER_ADDR: :8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://ss.digaji.id,http://ss.digaji.id}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-droproom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-droproom}
      REDIS_ADDR: redis:6379
      TOKEN_SECRET: ${TOKEN_SECRET:-replace-with-strong-production-secret-32chars}
      STORAGE_ROOT: /data/storage
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-104857600}
      DEFAULT_STORAGE_LIMIT_BYTES: ${DEFAULT_STORAGE_LIMIT_BYTES:-524288000}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_ADDR: clamav:3310
      DOWNLOAD_BANDWIDTH_KBPS: ${DOWNLOAD_BANDWIDTH_KBPS:-5120}
      RL_CREATE_ROOM_PER_MIN: ${RL_CREATE_ROOM_PER_MIN:-5}
      RL_JOIN_ROOM_PER_MIN: ${RL_JOIN_ROOM_PER_MIN:-60}
      RL_ROOM_PROBE_404_PER_MIN: ${RL_ROOM_PROBE_404_PER_MIN:-15}
      RL_VALIDATE_PW_PER_MIN_ROOM: ${RL_VALIDATE_PW_PER_MIN_ROOM:-30}
      RL_WS_HANDSHAKE_PER_MIN: ${RL_WS_HANDSHAKE_PER_MIN:-15}
      MAX_CONCURRENT_UPLOADS_PER_IP: ${MAX_CONCURRENT_UPLOADS_PER_IP:-5}
      MAX_CONCURRENT_DOWNLOADS_PER_IP: ${MAX_CONCURRENT_DOWNLOADS_PER_IP:-4}
    volumes:
      - storagedata:/data/storage
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_BIND:-80}:80"

volumes:
  mysqldata:
  redisdata:
  storagedata:
  clamavdb:
